version: "3.8"

services:
  crta:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - traefik-kpux
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crta.rule=Host(`crta.srv1750386.hstgr.cloud`)"
      - "traefik.http.routers.crta.entrypoints=websecure"
      - "traefik.http.routers.crta.tls=true"
      - "traefik.http.routers.crta.tls.certresolver=letsencrypt"
      - "traefik.http.services.crta.loadbalancer.server.port=80"

networks:
  traefik-kpux:
    external: true
