version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    volumes:
      - ./server:/app/server
      # preserve image-installed node_modules by creating an anonymous volume
      - /app/server/node_modules
      - ./data:/app/data
    restart: unless-stopped
